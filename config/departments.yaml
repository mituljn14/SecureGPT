# config/departments.yaml
# Structure: data/<Main Department>/<Sub Department>/
# Each MAIN department groups related sub-departments.
# Each SUB department is an actual folder on disk and carries the
# access_roles list — these are the units ingest.py reads permissions from.
# Add / edit departments here — ingest.py needs no code changes.

